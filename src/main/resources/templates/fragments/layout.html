<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="轻量级网络设备状态监测与异常告警系统">
    <title th:text="${pageTitle} + ' - 网络设备监测系统'">网络设备监测系统</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/device.css}">
</head>
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark nm-navbar">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
            <span class="nm-brand-mark">NM</span>
            <span>网络设备监测</span>
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}">首页</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'devices'} ? 'active' : ''"
                       th:href="@{/devices}">设备管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'alerts'} ? 'active' : ''"
                       th:href="@{/alerts}">告警</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'dashboard'} ? 'active' : ''"
                       th:href="@{/dashboard}">看板</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="nm-footer">
    <div class="container d-flex justify-content-between flex-wrap gap-2">
        <span>轻量级网络设备状态监测与异常告警系统</span>
        <span>本科毕业设计 · 阶段 5</span>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/vendor/bootstrap/bootstrap.bundle.min.js}"></script>
</th:block>

</body>
</html>
