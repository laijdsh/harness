# ============================================================
# 应用基本信息
# ============================================================
spring.application.name=network-monitor-system
app.version=0.1.0

# Web 服务端口。阶段 0 已确认 8080 空闲。
server.port=8080
server.shutdown=graceful
# 会话只使用 Cookie，避免重定向 URL 中出现 ;jsessionid=...
server.servlet.session.tracking-modes=cookie

# ============================================================
# MySQL 数据源
#
# 数据库密码不写死在代码和配置文件中。
# 开发环境已把 DB_PASSWORD 设置为当前 Windows 用户的环境变量。
# 如需换库，可通过 DB_URL、DB_USERNAME、DB_PASSWORD 覆盖。
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/network_monitor?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:netmon}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池配置
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=3000
# 允许数据库暂时不可用时应用仍能启动，健康检查会返回 DOWN
spring.datasource.hikari.initialization-fail-timeout=-1

# ============================================================
# JPA / Hibernate
#
# 表结构由 sql/init.sql 显式创建，Hibernate 只负责校验，
# 不允许自动修改数据库表结构。
# ============================================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# ============================================================
# Thymeleaf 与静态资源
# 开发阶段关闭模板缓存，修改页面后刷新即可看到变化。
# ============================================================
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

# 统一 JSON 时区。Spring Boot 4 使用 Jackson 3，
# 不再使用 Jackson 2 的 serialization.write-dates-as-timestamps 配置项。
spring.jackson.time-zone=Asia/Shanghai

# 错误页面不向客户端泄露内部异常信息
server.error.include-message=never
server.error.include-stacktrace=never

# ============================================================
# 网络监测参数
# ============================================================
# 单次 ping 的超时时间（毫秒）
monitor.timeout-ms=2000
# 定时检测周期，单位毫秒；当前为 60 秒
monitor.interval-ms=60000
# 应用启动后延迟多久开始第一次定时检测
monitor.initial-delay-ms=15000
# 是否启用定时检测
monitor.scheduler.enabled=true

# ============================================================
# 异常告警参数
# ============================================================
# 连续离线多少次触发离线告警
alert.consecutive-failure-threshold=3
# 响应时间超过多少毫秒触发延迟告警
alert.response-time-threshold-ms=100

# ============================================================
# 日志级别
# ============================================================
logging.level.com.networkmonitor=INFO
logging.level.org.hibernate.SQL=WARN
